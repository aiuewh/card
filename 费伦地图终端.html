<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>费伦地图终端 // FAERÛN MAP TERMINAL</title>
<style>
:root{
  --bg:#0B0F14; --panel:#11161D; --panel2:#0E1319; --line:#24303D;
  --amber:#F0B450; --teal:#4CC3A2; --red:#E5484D; --blue:#6E93B8; --dim:#8FA3C8;
  --text:#C9D4E0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:ui-monospace,'Cascadia Mono','Sarasa Mono SC','Noto Sans SC','PingFang SC',monospace;
  font-size:14px; overflow:hidden;
}
body::after{ /* 扫描线氛围 */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px);
}
#app{display:flex; flex-direction:column; height:100vh}
/* ── 顶栏 ── */
header{
  display:flex; align-items:center; gap:14px; padding:8px 14px;
  border-bottom:1px solid var(--line); background:var(--panel2); flex-wrap:wrap;
}
header .logo{color:var(--amber); font-weight:bold; letter-spacing:1px; white-space:nowrap}
header .logo small{color:var(--dim); font-weight:normal}
nav{display:flex; gap:6px; margin-left:4px}
nav button{
  background:transparent; border:1px solid var(--line); color:var(--dim);
  font:inherit; padding:4px 14px; cursor:pointer; letter-spacing:1px;
}
nav button.active{border-color:var(--amber); color:var(--amber)}
nav button:hover{color:var(--text)}
header .spacer{flex:1}
/* 搜索 */
.search{position:relative}
.search input{
  width:200px; background:var(--bg); border:1px solid var(--line); color:var(--text);
  font:inherit; padding:5px 8px; outline:none;
}
.search input:focus{border-color:var(--amber)}
.sugs{
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:60;
  background:var(--panel); border:1px solid var(--line); max-height:320px; overflow-y:auto;
}
.sugs .item{padding:5px 9px; cursor:pointer; line-height:1.4}
.sugs .item:hover{background:#161E27; color:var(--amber)}
.sugs .item .en{color:var(--dim); font-size:11px; margin-left:6px}
header .clock{color:var(--dim); font-size:12px; white-space:nowrap}
/* ── 主体 ── */
main{flex:1; display:flex; min-height:0}
.mapwrap{flex:1; position:relative; background:#070A0E; min-width:0}
.mapview{position:absolute; inset:0; overflow:hidden; cursor:grab}
.mapview.drag{cursor:grabbing}
.pan{position:absolute; left:0; top:0; transform-origin:0 0}
.pan img{display:block; max-width:none; user-select:none; -webkit-user-drag:none}
.pins{position:absolute; left:0; top:0; width:100%; height:100%}
.pin{
  position:absolute; transform:translate(-50%,-50%) scale(var(--inv,1)); cursor:pointer;
  width:22px; height:22px; border-radius:50%;
  background:rgba(11,15,20,.85); border:1.5px solid var(--amber); color:var(--amber);
  font-size:11px; display:flex; align-items:center; justify-content:center;
  transition:box-shadow .15s, background .15s;
  pointer-events:auto;
}
.pin:hover{background:var(--amber); color:#000}
.pin.sel{background:var(--amber); color:#000; box-shadow:0 0 0 4px rgba(240,180,80,.3), 0 0 18px rgba(240,180,80,.7)}
.pin.tavern{border-color:var(--teal); color:var(--teal)}
.pin.tavern:hover,.pin.tavern.sel{background:var(--teal); color:#000}
.pin.secret{border-color:var(--red); color:var(--red); border-style:dashed}
.pin.secret:hover,.pin.secret.sel{background:var(--red); color:#000}
.pin.star{
  width:22px; height:22px; font-size:14px; border-width:2px;
  background:rgba(240,180,80,.18);
}
.pin.star:hover,.pin.star.sel{background:var(--amber); color:#000}
.plabel{
  position:absolute; transform:translate(-50%,8px) scale(var(--inv,1));
  pointer-events:none; color:var(--amber); font-size:11px;
  text-shadow:0 0 4px #000, 0 1px 2px #000; white-space:nowrap; letter-spacing:1px;
}
.dlabel{
  position:absolute; transform:translate(-50%,-50%) scale(var(--inv,1)); pointer-events:none;
  color:rgba(240,180,80,.85); font-size:12px; letter-spacing:3px;
  text-shadow:0 0 6px rgba(0,0,0,.9), 0 0 2px #000; white-space:nowrap;
}
.dlabel small{display:block; text-align:center; font-size:10px; color:var(--dim); letter-spacing:1px}
.zoombar{
  position:absolute; right:12px; bottom:12px; display:flex; gap:6px; z-index:5;
}
.zoombar button{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  font:inherit; width:32px; height:28px; cursor:pointer;
}
.zoombar button:hover{border-color:var(--amber); color:var(--amber)}
.hint{
  position:absolute; left:12px; bottom:12px; color:var(--dim); font-size:11px; z-index:5;
  background:rgba(11,15,20,.7); padding:4px 8px; border:1px solid var(--line);
}
/* 小地图视图：返回按钮 */
.backbar{position:absolute; right:12px; top:12px; z-index:6; display:flex; gap:8px}
.backbar button{
  background:rgba(17,22,29,.92); border:1px solid var(--amber); color:var(--amber);
  font:inherit; font-size:12px; letter-spacing:1px; padding:5px 12px; cursor:pointer;
}
.backbar button:hover{background:var(--amber); color:#000}
.viewname{
  position:absolute; left:12px; top:12px; z-index:5; color:var(--amber);
  font-size:12px; letter-spacing:2px; background:rgba(11,15,20,.7);
  padding:5px 10px; border:1px solid var(--line);
}
/* ── 弹窗 ── */
.modal-mask{
  position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-mask.open{display:flex}
.modal{
  background:var(--panel); border:1px solid var(--amber); border-radius:10px;
  width:min(600px,94%); max-height:82vh; overflow-y:auto; padding:16px 18px;
  box-shadow:0 12px 48px rgba(0,0,0,.6);
}
.modal .m-head{display:flex; align-items:flex-start; gap:10px}
.modal .m-head>div{flex:1}
.modal h2{color:var(--amber); font-size:18px; letter-spacing:1px}
.modal .sub{color:var(--dim); font-size:12px; letter-spacing:1px; margin-top:2px}
.modal .m-close{
  background:transparent; border:1px solid var(--line); color:var(--dim);
  font:inherit; width:28px; height:28px; cursor:pointer; flex:none;
}
.modal .m-close:hover{border-color:var(--amber); color:var(--amber)}
.modal .m-tags{margin:8px 0 0}
.modal .tag{
  display:inline-block; border:1px solid var(--line); color:var(--teal);
  font-size:11px; padding:1px 8px; margin:0 6px 6px 0;
}
.modal .desc{line-height:1.8; white-space:pre-wrap; margin-top:6px}
.modal hr{border:none; border-top:1px solid var(--line); margin:12px 0}
.modal .m-acts{margin-top:12px}
.modal .m-btn{
  display:inline-flex; align-items:center; gap:7px;
  background:linear-gradient(180deg,#1a2432,#11161d); border:1px solid var(--amber);
  color:var(--amber); font:inherit; font-size:13px; letter-spacing:1px;
  padding:8px 16px; cursor:pointer;
}
.modal .m-btn:hover{background:var(--amber); color:#000}
.modal .m-links{font-size:12px; line-height:2}
.modal .m-links .lk-label{color:var(--dim)}
.modal .m-links a{color:var(--teal); text-decoration:none; border-bottom:1px dotted rgba(76,195,162,.5)}
.modal .m-links a:hover{color:var(--amber); border-color:var(--amber)}
.modal .m-sec{color:var(--amber); font-size:12px; letter-spacing:2px; margin:12px 0 6px}
.modal .m-item{
  display:flex; align-items:center; gap:10px; padding:6px 8px; border:1px solid transparent;
}
.modal .m-item:hover{border-color:var(--line); background:#161E27}
.modal .m-item .mi-name{flex:1}
.modal .m-item .mi-name small{color:var(--dim); margin-left:6px}
.modal .m-item button{
  background:transparent; border:1px solid var(--line); color:var(--dim);
  font:inherit; font-size:11px; padding:3px 12px; cursor:pointer;
}
.modal .m-item button:hover{border-color:var(--amber); color:var(--amber)}
/* 底栏 */
footer{
  display:flex; gap:18px; padding:5px 14px; border-top:1px solid var(--line);
  background:var(--panel2); color:var(--dim); font-size:11px; letter-spacing:1px; flex-wrap:wrap;
}
footer .ok{color:var(--teal)}
::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#263240} ::-webkit-scrollbar-track{background:transparent}
@media (max-width:760px){ .search input{width:130px} header .clock{display:none} }
</style>
</head>

/* ══════════════ 框架 ══════════════ */
const $=s=>document.querySelector(s);
let TAB="fr", SEL=null, VIEW={x:0,y:0,s:1};
let CUR_FIT={nw:7990,nh:5635,max:1.15,min:0.05};
function clampS(s){return Math.min(CUR_FIT.max, Math.max(CUR_FIT.min, s))}
function fitView(){
  const wrap=$("#mapwrap").getBoundingClientRect();
  const s=wrap.width/CUR_FIT.nw;
  VIEW={x:(wrap.width-CUR_FIT.nw*s)/2, y:(wrap.height-CUR_FIT.nh*s)/2, s};
  CUR_FIT.min=s*0.5;
  applyView();
}
function focusOn(pfx, pfy){
  const wrap=$("#mapwrap").getBoundingClientRect();
  const s=Math.min(CUR_FIT.max, CUR_FIT.focusS || CUR_FIT.max*0.6);
  VIEW.x=wrap.width/2 - pfx*CUR_FIT.nw*s;
  VIEW.y=wrap.height/2 - pfy*CUR_FIT.nh*s;
  VIEW.s=s; applyView();
}
function applyView(){
  const p=$("#pan");
  if(p) p.style.transform=`translate(${VIEW.x}px,${VIEW.y}px) scale(${VIEW.s})`;
  const pins=$("#pins");
  if(pins) pins.style.setProperty("--inv", (1/VIEW.s).toFixed(4));
}
let drag=null, wdDrag=null, JUST_PANNED=false, VB={x:0,y:0,w:1000,h:700};
function applyVB(){const s=$("#svg"); if(s) s.setAttribute("viewBox",`${VB.x} ${VB.y} ${VB.w} ${VB.h}`)}
function zhName(n){if(n==null)return n; const d=window.NAME_ZH||{}; const z=window.ZONE_ZH||{}; return d[n]||d[n.replace(/'/g,"’")]||d[n.replace(/’/g,"'")]||z[n]||n}
window.addEventListener("mousemove",e=>{
  if(drag){const mv=document.querySelector(".mapview"); if(mv){VIEW.x=e.clientX-drag.x;VIEW.y=e.clientY-drag.y;applyView()}}
  if(wdDrag){
    wdDrag.moved=true;
    const svg=$("#svg"); if(svg){
      const r=svg.getBoundingClientRect();
      VB.x=wdDrag.vx-(e.clientX-wdDrag.x)*VB.w/r.width;
      VB.y=wdDrag.vy-(e.clientY-wdDrag.y)*VB.h/r.height;
      applyVB();
    }
  }
});
window.addEventListener("mouseup",()=>{
  drag=null; const mv=document.querySelector(".mapview"); if(mv)mv.classList.remove("drag");
  if(wdDrag){const svg=$("#svg"); if(svg)svg.classList.remove("panning");
    if(wdDrag.moved){JUST_PANNED=true; setTimeout(()=>JUST_PANNED=false,60)}
    wdDrag=null}
});
function bindMapEvents(){
  const mv=$("#mv");
  mv.addEventListener("mousedown",e=>{drag={x:e.clientX-VIEW.x,y:e.clientY-VIEW.y};mv.classList.add("drag")});
  mv.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=mv.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.25:1/1.25);
  },{passive:false});
  mv.addEventListener("dblclick",e=>{
    e.preventDefault();
    const r=mv.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, 1.7);
  });
  $("#zo").onclick=()=>{const r=$("#mapwrap").getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1.35)};
  $("#zo2").onclick=()=>{const r=$("#mapwrap").getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1/1.35)};
  $("#zr").onclick=fitView;
}
function zoomAt(mx,my,f){
  const ns=clampS(VIEW.s*f);
  VIEW.x=mx-(mx-VIEW.x)*(ns/VIEW.s); VIEW.y=my-(my-VIEW.y)*(ns/VIEW.s); VIEW.s=ns; applyView();
}
function stripHtml(s){return String(s||"").replace(/<%>/g,"【剧透】").replace(/<\/?>/g,"").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ").trim()}

/* ── 返回钮 + 视图名（小地图视图通用） ── */
function addBackBar(name){
  const wrap=$("#mapwrap");
  const bar=document.createElement("div"); bar.className="backbar";
  const b=document.createElement("button"); b.textContent="← 返回全域";
  b.addEventListener("click",()=>switchTab("fr"));
  bar.appendChild(b); wrap.appendChild(bar);
  const vn=document.createElement("div"); vn.className="viewname"; vn.textContent=name;
  wrap.appendChild(vn);
}

let FRINDEX=[]; // 搜索索引
function buildFR(){
  $("#mapwrap").innerHTML=`
    <div class="mapview" id="mv"><div class="pan" id="pan">
      <img src="${U("费伦交互地图底图_7990x5635.jpg")}" draggable="false">
      <div class="pins" id="pins"></div>
    </div></div>
    <div class="zoombar"><button id="zo">＋</button><button id="zo2">－</button><button id="zr">⌂</button></div>
    <div class="hint">滚轮/双击缩放 · 拖拽移动 · 点击地点弹窗查看详情，弹窗内可进入小地图</div>`;
  const pins=$("#pins");
  const W=7990, H=5635;
  const STARS=new Set(["深水城","无冬城","博德之门","路斯坎","银月城","卡林港","阿斯卡特拉","扎泽斯珀","埃尔托瑞尔","烛堡","伊利亚博","西门城","普罗坎珀","鸦崖城","坦特拉斯","希尔斯法","弗兰城","珍提尔堡","穆尔马斯特","梅尔旺特","因纳里丝","明塔尔","奥姆佩塔","阿拉巴","穆兰","梅姆农","贝赞特","莱拉巴","卢斯切克","西姆巴","阿姆鲁萨","皮亚拉多斯","苏尔提姆","贝达斯克","米拉特马","纳德港","魔索布莱城","艾佛瑞斯卡","埃斯梅尔塔兰"]);
  FRINDEX=[];
  (window.groupe||[]).forEach((g,i)=>{
    if(g.name==="GROUP"||g.x==null) return;
    const en=stripHtml(g.name);
    const zh=zhName(en);
    const big=STARS.has(zh);
    const el=document.createElement("div");
    el.className="pin fr"+(big?" star":"");
    el.style.left=(g.x/W*100)+"%"; el.style.top=(g.y/H*100)+"%";
    el.style.borderColor=g.color||"#F0B450"; el.style.color=g.color||"#F0B450";
    if(big){ el.textContent="★"; }
    else { el.style.width="10px"; el.style.height="10px"; el.style.borderWidth="1px"; }
    el.title=zh+(en!==zh?" · "+en:"");
    el.dataset.n=zh; el.dataset.i=i;
    el.addEventListener("click",e=>{e.stopPropagation(); selectFR(g, i, el);});
    pins.appendChild(el);
    if(big){
      const lb=document.createElement("div");
      lb.className="plabel"; lb.textContent=zh;
      lb.style.left=(g.x/W*100)+"%"; lb.style.top=(g.y/H*100)+"%";
      pins.appendChild(lb);
    }
    FRINDEX.push({name:zh, en, x:g.x/W*100, y:g.y/H*100, g, i});
  });
  CUR_FIT={nw:7990,nh:5635,max:1.15,min:0.05,focusS:0.7};
  const im=$("#pan img");
  const onImg=()=>fitView();
  if(im.complete&&im.naturalWidth) onImg(); else im.addEventListener("load",onImg);
  bindMapEvents();
  (window.zones||[]).forEach((z,zi)=>{
    const n=stripHtml(z.name);
    FRINDEX.unshift({name:zhName(n)||n, en:n, zone:zi});
  });
}
function selectFR(g, i, el){
  const zh=window.FAERUN_ZH&&window.FAERUN_ZH[i];
  const dispName=zhName(stripHtml(g.name));
  if(SEL && SEL.name===dispName){ closeModal(); SEL=null; return }
  SEL={name:dispName, en:stripHtml(g.name), t:"landmark", d:(zh||stripHtml(g.txt).slice(0,1500))||"（无描述）"};
  document.querySelectorAll("#pins .pin").forEach(p=>p.classList.remove("sel"));
  if(el)el.classList.add("sel");
  openModal(SEL);
}

  WDMAP.locs.forEach(l=>{
    const el=document.createElement("div");
    el.className="pin"+(l.t==="tavern"?" tavern":l.t==="danger"||l.t==="secret"?" secret":"");
    el.style.left=l.x+"%"; el.style.top=l.y+"%";
    el.title=l.name;
    el.addEventListener("click",e=>{e.stopPropagation(); selectCity(l, el);});
    pins.appendChild(el);
    const lb=document.createElement("div");
    lb.className="plabel"; lb.textContent=l.name;
    lb.style.left=l.x+"%"; lb.style.top=l.y+"%";
    pins.appendChild(lb);
  });
  CUR_FIT={nw:W,nh:H,max:1.6,min:0.1,focusS:1.1};
  const im=$("#pan img");
  const onImg=()=>fitView();
  if(im.complete&&im.naturalWidth) onImg(); else im.addEventListener("load",onImg);
  bindMapEvents();
  addBackBar("WD:// 深水城");
}
function selectCity(l, el){
  if(SEL && SEL.name===l.name){ closeModal(); SEL=null; return }
  SEL=l;
  document.querySelectorAll("#pins .pin").forEach(p=>p.classList.remove("sel"));
  if(el)el.classList.add("sel");
  openModal(l);
}

/* ══════════════ 通用图片视图（本地小地图/全域图） ══════════════ */
function buildIMG(m){
  $("#mapwrap").innerHTML=`
    <div class="mapview" id="mv"><div class="pan" id="pan">
      <img src="${U(m.img)}" draggable="false">
    </div></div>
    <div class="zoombar"><button id="zo">＋</button><button id="zo2">－</button><button id="zr">⌂</button></div>
    <div class="hint">${m.zh} · ${m.note||""} · 滚轮/双击缩放 · 拖拽移动</div>`;
  addBackBar("MAP:// "+m.zh);
  TAB="img"; SEL=null;
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  const im=$("#pan img");
  const onImg=()=>{
    const wrap=$("#mapwrap").getBoundingClientRect();
    const s0=Math.min(wrap.width/im.naturalWidth, wrap.height/im.naturalHeight);
    CUR_FIT={nw:im.naturalWidth, nh:im.naturalHeight, max:s0*4, min:s0*0.4, focusS:s0};
    fitView();
  };
  im.addEventListener("error",()=>{
    const hint=$("#mapwrap .hint");
    if(hint) hint.innerHTML=`${m.zh} · 图片资源未能加载——可能尚未上传到图库，或 CDN 缓存未刷新（约12小时）。可先用「通用图集」外部链接。`;
  });
  if(im.complete&&im.naturalWidth) onImg(); else im.addEventListener("load",onImg);
  bindMapEvents();
  $("#ftab").textContent="MAP:// "+m.zh;
}

/* ══════════════ 弹窗 ══════════════ */
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function findMini(name, en){
  const keys=[norm(en), norm(name)].filter(Boolean);
  if(!keys.length) return null;
  return MINIMAPS.find(m=>m.en.some(e=>keys.includes(norm(e))) || keys.includes(norm(m.zh))) || null;
}
function findWiki(name, en){
  const k=norm(en);
  if(k && WIKI_MAPS[k]) return WIKI_MAPS[k];
  for(const kk in WIKI_MAPS){ if(WIKI_MAPS[kk].z===name) return WIKI_MAPS[kk] }
  return null;
}
function openModal(o){
  const mask=$("#modal-mask"), modal=$("#modal");
  const tagMap={landmark:"地标",tavern:"酒馆/据点",danger:"危险区",secret:"机密",ward:"区域"};
  const mini=findMini(o.name,o.en), wiki=findWiki(o.name,o.en);
  let h=`<div class="m-head"><div><h2>${o.name}</h2><div class="sub">${o.en||""}</div></div><button class="m-close" id="m-close">✕</button></div>`;
  h+=`<div class="m-tags"><span class="tag">${tagMap[o.t]||"地点"}</span></div>`;
  h+=`<div class="desc">${o.d||"（暂无描述）"}</div>`;
  if(mini) h+=`<div class="m-acts"><button class="m-btn" id="m-enter">⬈ 进入小地图 · ${mini.zh}</button></div>`;
  h+=`<hr><div class="m-links">`;
  if(wiki){
    h+=`<div><span class="lk-label">Wiki 词条：</span><a href="${WIKI+encodeURIComponent(wiki.w.replace(/ /g,"_"))}" target="_blank" rel="noopener">${wiki.z}</a></div>`;
    if(wiki.f&&wiki.f.length) h+=`<div><span class="lk-label">Wiki 专题地图：</span>${wiki.f.map(f=>`<a href="${WIKIFP+encodeURIComponent(f)}" target="_blank" rel="noopener">${f}</a>`).join(" · ")}</div>`;
  }else if(o.en){
    h+=`<div><span class="lk-label">外部资源：</span><a href="${WIKI+encodeURIComponent(String(o.en).replace(/ /g,"_"))}" target="_blank" rel="noopener">在遗忘国度 Wiki 搜索此地点</a></div>`;
  }
  h+=`<div><span class="lk-label">通用图集：</span><a href="${ATLAS[0][1]}" target="_blank" rel="noopener">AideDD</a> · <a href="${ATLAS[1][1]}" target="_blank" rel="noopener">Kassoon</a> · <a href="#" id="m-atlas">本地图集</a></div>`;
  h+=`</div>`;
  modal.innerHTML=h;
  mask.classList.add("open");
  $("#m-close").addEventListener("click",closeModal);
  const at=$("#m-atlas"); if(at)at.addEventListener("click",e=>{e.preventDefault(); openAtlas()});
  const en=$("#m-enter"); if(en)en.addEventListener("click",()=>{closeModal(); enterMini(mini)});
}
function closeModal(){ $("#modal-mask").classList.remove("open") }
$("#modal-mask").addEventListener("click",e=>{ if(e.target===$("#modal-mask")) closeModal() });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closeAtlas() } });
function enterMini(m){
  SEL=null;
  document.querySelectorAll("#pins .pin").forEach(p=>p.classList.remove("sel"));
  if(m.view){ switchTab(m.view); return }
  buildIMG(m);
}

/* ══════════════ 图集 ══════════════ */
function openAtlas(){
  const mask=$("#modal-mask"), modal=$("#modal");
  const GRP={city:"城市小地图",region:"区域地图",dungeon:"地下城",world:"费伦全域"};
  let h=`<div class="m-head"><div><h2>🗺 地图图集</h2><div class="sub">ATLAS · 本地图集与外部资源</div></div><button class="m-close" id="m-close">✕</button></div>`;
  h+=`<div class="m-sec">交互视图</div>`;
  MINIMAPS.filter(m=>m.view).forEach(m=>{
    h+=`<div class="m-item"><span class="mi-name">${m.zh}<small>${m.note||""}</small></span><button data-view="${m.view}">进入</button></div>`;
  });
  ["region","city","dungeon","world"].forEach(g=>{
    const list=MINIMAPS.filter(m=>m.grp===g&&m.img);
    if(!list.length) return;
    h+=`<div class="m-sec">${GRP[g]}</div>`;
    list.forEach(m=>{
      h+=`<div class="m-item"><span class="mi-name">${m.zh}<small>${m.note||""}</small></span><button data-img="${m.id}">查看</button></div>`;
    });
  });
  h+=`<div class="m-sec">外部图集</div>`;
  h+=`<div class="m-links">`+ATLAS.map(a=>`<div>▸ <a href="${a[1]}" target="_blank" rel="noopener">${a[0]}</a></div>`).join("")+`</div>`;
  modal.innerHTML=h;
  mask.classList.add("open");
  $("#m-close").addEventListener("click",closeModal);
  modal.querySelectorAll("button[data-view]").forEach(b=>b.addEventListener("click",()=>{closeModal(); switchTab(b.dataset.view)}));
  modal.querySelectorAll("button[data-img]").forEach(b=>b.addEventListener("click",()=>{
    const m=MINIMAPS.find(x=>x.id===b.dataset.img); if(!m) return;
    closeModal(); enterMini(m);
  }));
}
function closeAtlas(){ closeModal() }
$("#atlas-btn").addEventListener("click",openAtlas);

/* ══════════════ 搜索 ══════════════ */
const q=$("#q"), sugs=$("#sugs");
q.addEventListener("input",()=>{
  const v=(q.value||"").trim().toLowerCase();
  if(!v||TAB!=="fr"){ sugs.style.display="none"; if(TAB!=="fr"&&v) switchTab("fr"); }
  if(!v){ return }
  const hits=FRINDEX.filter(l=>l.name.toLowerCase().includes(v)||(l.en||"").toLowerCase().includes(v)).slice(0,10);
  if(!hits.length){ sugs.innerHTML=`<div class="item">无匹配</div>`; sugs.style.display="block"; return }
  sugs.innerHTML=hits.map((h,i)=>`<div class="item" data-i="${FRINDEX.indexOf(h)}">${h.name}<span class="en">${h.en||""}</span></div>`).join("");
  sugs.style.display="block";
  sugs.querySelectorAll(".item").forEach(it=>it.addEventListener("click",()=>{
    const o=FRINDEX[+it.dataset.i];
    sugs.style.display="none"; q.value="";
    if(o.zone!=null){
      const z=(window.zones||[])[o.zone];
      SEL={name:o.name, en:o.en, t:"ward", d:(window.FAERUN_ZH&&window.FAERUN_ZH["z"+o.zone]||stripHtml(z.txt).slice(0,800))||"（无描述）"};
      openModal(SEL); return;
    }
    focusOn(o.x/100, o.y/100);
    const pin=[...document.querySelectorAll("#pins .pin")].find(p=>p.dataset.i==o.i);
    document.querySelectorAll("#pins .pin").forEach(p=>p.classList.remove("sel"));
    if(pin){ pin.classList.add("sel"); }
    SEL={name:o.name, en:o.en, t:"landmark", d:(window.FAERUN_ZH&&window.FAERUN_ZH[o.i]||stripHtml(o.g.txt).slice(0,1500))||"（无描述）"};
    openModal(SEL);
  }));
});
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) sugs.style.display="none" });

/* ══════════════ 标签页 ══════════════ */
function switchTab(t){
  TAB=t; SEL=null; closeModal();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  if(t==="nwn"){ buildNWN(); $("#ftab").textContent="NWN:// Neverwinter · Guide to Neverwinter" }
  else if(t==="wdmap"){ buildWDMAP(); $("#ftab").textContent="WD:// Waterdeep · WDH Official Map" }
  else { buildFR(); $("#ftab").textContent="FR:// Faerûn · Sword Coast" }
}
document.querySelectorAll("nav button[data-tab]").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

/* 时钟氛围 */
setInterval(()=>{
  const d=new Date();
  $("#clock").textContent=`FR 1493 DR · ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
},1000);

switchTab("fr");
</script>
